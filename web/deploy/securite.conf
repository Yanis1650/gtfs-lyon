# En-têtes de sécurité, inclus dans CHAQUE bloc location : dès qu'un bloc a son propre
# add_header, nginx oublie ceux du niveau server (piège relevé dans la liste de contrôle).
#
# CSP : tout vient du site, sauf le fond de carte (style, tuiles, glyphes, sprites) chez
# OpenFreeMap. Les workers MapLibre sont servis par le site ; les styles en ligne sont
# requis par MapLibre et par les liaisons :style de Vue.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org; font-src 'self'; connect-src 'self' https://tiles.openfreemap.org; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
