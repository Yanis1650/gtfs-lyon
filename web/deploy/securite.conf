# En-têtes de sécurité, inclus au niveau server et dans CHAQUE bloc location : dès qu'un
# bloc a son propre add_header, nginx oublie ceux du niveau server (piège relevé dans la
# liste de contrôle de sécurité).
#
# CSP : tout vient du site, sauf le fond de carte (style, tuiles, glyphes, sprites) chez
# OpenFreeMap et les photographies aériennes de la vue satellite chez l'IGN. Les workers MapLibre sont servis par le site, sans blob: ; les styles en
# ligne sont requis par MapLibre et par les liaisons :style de Vue.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org https://data.geopf.fr; font-src 'self'; connect-src 'self' https://tiles.openfreemap.org https://data.geopf.fr; worker-src 'self'; child-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
