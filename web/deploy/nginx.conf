# Site statique servi par nginx sans droits root (image nginx-unprivileged, port 8080).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    charset utf-8;

    # En-têtes aussi au niveau server : les réponses produites hors de tout bloc location
    # (405 ci-dessous, 400 et 414 de nginx) les reçoivent. Chaque location les redéclare,
    # sans doublon : nginx n'hérite pas des add_header dès qu'un bloc a les siens.
    include /etc/nginx/snippets/securite.conf;

    # Compression faite à la construction, jamais pendant les visites (CPU limité à 0,5).
    # Les originaux restent disponibles quand le client n'accepte pas gzip.
    gzip off;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;

    # Rien d'autre que GET et HEAD sur un site statique.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Fichiers cachés (.git, .env…) : jamais servis.
    location ~ /\. {
        include /etc/nginx/snippets/securite.conf;
        return 404;
    }

    # Fichiers à empreinte de Vite : cache long.
    location /assets/ {
        include /etc/nginx/snippets/securite.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Couches de la carte : sans empreinte dans leur nom, elles sont revalidées à chaque visite
    # (un 304 si rien n'a changé), pour ne jamais servir d'anciennes données au code d'un nouveau déploiement.
    # Un bloc types remplace toute la table MIME : on le limite à ce dossier.
    location /data/ {
        types {
            application/geo+json geojson;
            application/json json;
            application/octet-stream bin;
        }
        include /etc/nginx/snippets/securite.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # La page unique ; une adresse inconnue répond un vrai 404 (l'atlas navigue par l'ancre #).
    location / {
        include /etc/nginx/snippets/securite.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/securite.conf;
        internal;
    }
}
