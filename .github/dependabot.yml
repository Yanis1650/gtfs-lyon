# Mises à jour de sécurité et de version, chaque semaine.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /pipeline
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: [/web, /pipeline]
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
