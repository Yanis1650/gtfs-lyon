<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img"><title>Explorer l’offre, les vitesses et l’accessibilité du réseau TCL</title><rect width="1080" height="1350" fill="#f7f2e6"/><g font-family="Segoe UI, Arial, sans-serif"><text x="64" y="76" fill="#bc6a4a" font-size="19" font-weight="600" letter-spacing="2">ATLAS DES TRANSPORTS LYONNAIS</text><text x="1016" y="76" fill="#4a5654" font-size="19" font-weight="400" text-anchor="end">03 / 03</text><text x="64" y="166" fill="#1c2523" font-size="58" font-weight="650" >À vous d’explorer.</text><text x="64" y="235" fill="#3c565d" font-size="30" font-weight="400" >Trois questions pour lire le réseau TCL.</text><path d="M64,311L1016,311" stroke="#dcd3bd" stroke-width="1"/><text x="64" y="351" fill="#bc6a4a" font-size="25" font-weight="600" >01</text><text x="146" y="351" fill="#1c2523" font-size="36" font-weight="600" >À quelle heure passe-t-il ?</text><text x="146" y="400" fill="#4a5654" font-size="25" font-weight="400" >Explorez l’offre et les départs à chaque arrêt.</text><path d="M64,509L1016,509" stroke="#dcd3bd" stroke-width="1"/><text x="64" y="549" fill="#bc6a4a" font-size="25" font-weight="600" >02</text><text x="146" y="549" fill="#1c2523" font-size="36" font-weight="600" >À quelle vitesse ?</text><text x="146" y="598" fill="#4a5654" font-size="25" font-weight="400" >Comparez les lignes et leurs tronçons.</text><path d="M64,707L1016,707" stroke="#dcd3bd" stroke-width="1"/><text x="64" y="747" fill="#bc6a4a" font-size="25" font-weight="600" >03</text><text x="146" y="747" fill="#1c2523" font-size="36" font-weight="600" >Que peut-on rejoindre ?</text><text x="146" y="796" fill="#4a5654" font-size="25" font-weight="400" >Explorez l’accessibilité en 30 et 45 minutes.</text><rect x="64" y="930" width="952" height="220" fill="#3c565d"/><text x="100" y="994" fill="#f7f2e6" font-size="32" font-weight="600" >Ouvrez la carte interactive</text><text x="100" y="1065" fill="#f7f2e6" font-size="44" font-weight="600" >atlas-lyon.drekky.fr</text><text x="100" y="1111" fill="#f7f2e6" font-size="20" font-weight="400" >Code public · Données ouvertes · Sans suivi publicitaire</text><path d="M64,1218L1016,1218" stroke="#dcd3bd" stroke-width="1"/><text x="64" y="1257" fill="#4a5654" font-size="20" font-weight="400" >Horaires théoriques · 17 novembre 2026</text><text x="64" y="1292" fill="#4a5654" font-size="17" font-weight="400" >Sources : SYTRAL Mobilités · OSM · Insee Filosofi 2021</text><text x="64" y="1327" fill="#3c565d" font-size="22" font-weight="600" >atlas-lyon.drekky.fr</text><text x="1016" y="1327" fill="#4a5654" font-size="19" font-weight="400" text-anchor="end">Yanis Lepesant</text></g></svg>